<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Snap to Play</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    font-family: -apple-system, "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif;
    color: #eee;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; }

  /* Fullscreen stage. Uses dvh so the mobile URL bar can't letterbox it. */
  #camWrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: none;
    background: #000;
    overflow: hidden;
  }
  /* The video is the only layer CSS is allowed to crop — `cover` keeps its
     aspect ratio (no stretching) and the JS below reproduces the exact same
     crop for the overlay layers, so nothing drifts out of alignment. */
  #cam {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: scaleX(-1);   /* mirror, like a selfie view */
  }
  /* Overlay layers are sized to the viewport in JS at the exact pixel count,
     so CSS never rescales them — no deformation, no offset. */
  #overlay, #three {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* start screen */
  #startScreen {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    text-align: center;
  }
  #startBtn {
    padding: 16px 40px;
    font-size: 18px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #1f1f1f;
    color: #eee;
    cursor: pointer;
  }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
  #status {
    font-size: 15px;
    line-height: 1.5;
    color: #999;
    max-width: 32em;
  }

  /* on-camera status line */
  #hint {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 15;
    padding: 8px 16px;
    font-size: 14px;
    color: #ddd;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 4px;
    display: none;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  #snapFlash {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    top: calc(16px + env(safe-area-inset-top, 0px));
    z-index: 15;
    padding: 8px 16px;
    font-size: 14px;
    color: #6fcf97;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #snapFlash.show { opacity: 1; transition: opacity 0s; }

  /* staged interaction: the prompt, then the countdown */
  #countdown {
    position: fixed;
    inset: 0;
    z-index: 16;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #countdown.show { display: flex; }
  #countNum {
    font-size: 22vmin;
    font-weight: 200;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 24px rgba(120, 190, 255, 0.65);
    font-variant-numeric: tabular-nums;
  }
  #countNum.tick { animation: tick 0.9s ease-out; }
  @keyframes tick {
    from { transform: scale(1.35); opacity: 0.25; }
    to   { transform: scale(1);    opacity: 1; }
  }
  #equipFlash {
    position: fixed;
    inset: 0;
    z-index: 17;
    background: radial-gradient(circle at 50% 50%,
                rgba(150,210,255,0.55), rgba(150,210,255,0) 60%);
    opacity: 0;
    pointer-events: none;
  }
  #equipFlash.go { animation: equip 0.75s ease-out; }
  @keyframes equip {
    from { opacity: 1; transform: scale(0.7); }
    to   { opacity: 0; transform: scale(1.3); }
  }

  /* the photo taken at the moment of the snap, shown once the video ends */
  #photoView {
    position: fixed;
    inset: 0;
    z-index: 32;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #000;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  #photoView.show { display: flex; animation: photoIn 420ms ease-out; }
  @keyframes photoIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
  #photoImg {
    max-width: 100%;
    max-height: calc(100% - 76px);
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(120, 190, 255, 0.25);
  }
  #photoBar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #photoBar button, #photoBar a {
    padding: 11px 22px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid #444;
    border-radius: 4px;
    background: #1b1b1b;
    color: #eee;
    cursor: pointer;
    text-decoration: none;
  }
  #photoBar a { border-color: #4a7fa8; }

  #player {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;   /* never distort the video */
    display: none;
    z-index: 30;
  }
  /* Detonation, not a spring: almost all of the expansion happens in the first
     few frames, then it slams to a stop. No overshoot — overshoot is what reads
     as bouncy. The brightness spike is the flash of the blast. */
  /* Measured across the first frames: 27% → 44% → 58%, then a surge to 79% by
     100ms and a hard stop. Fast enough to read as a detonation, but not so
     instant that you never see it erupt from the fingers. */
  #player.blast {
    animation: blast var(--pop, 320ms) cubic-bezier(0.12, 0.72, 0.2, 1) both;
  }
  @keyframes blast {
    0%   { transform: scale(0.02); opacity: 0; filter: brightness(3.4) contrast(1.6); }
    6%   { opacity: 1; }
    22%  { filter: brightness(1.35) contrast(1.12); }   /* the flash is brief */
    100% { transform: scale(1);    opacity: 1; filter: brightness(1) contrast(1); }
  }

  /* the shockwave ring thrown off at the snap point */
  #shock {
    position: fixed;
    z-index: 29;
    width: 16px;
    height: 16px;
    margin: -8px 0 0 -8px;
    border-radius: 50%;
    border: 6px solid rgba(210, 238, 255, 0.95);
    box-shadow: 0 0 50px rgba(150, 210, 255, 0.95),
                inset 0 0 30px rgba(150, 210, 255, 0.7);
    opacity: 0;
    pointer-events: none;
    display: none;
  }
  #shock.go {
    display: block;
    animation: shock var(--shock, 560ms) cubic-bezier(0, 0.75, 0.2, 1) both;
  }
  @keyframes shock {
    0%   { opacity: 1; transform: scale(1);  border-width: 6px; }
    70%  { opacity: 0.45; }
    100% { opacity: 0; transform: scale(70); border-width: 0.5px; }
  }

  /* the world flinches from the blast */
  #camWrap.shake { animation: shake 300ms ease-out; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    12% { transform: translate(-7px,  5px); }
    26% { transform: translate( 6px, -6px); }
    42% { transform: translate(-5px, -3px); }
    58% { transform: translate( 4px,  4px); }
    76% { transform: translate(-2px,  1px); }
  }
</style>
</head>
<body>

<div id="camWrap">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <canvas id="three"></canvas>
</div>

<div id="hint">偵測中…請彈指</div>
<div id="snapFlash">Snap detected!</div>
<div id="countdown"><div id="countNum">2</div></div>
<div id="equipFlash"></div>
<div id="shock"></div>

<div id="startScreen">
  <button id="startBtn">Start Camera 開啟相機偵測</button>
  <div id="status">Click to enable camera 點擊啟用相機</div>
</div>

<video id="player" src="video.mp4" playsinline preload="auto"></video>

<div id="photoView">
  <img id="photoImg" alt="snap photo">
  <div id="photoBar">
    <a id="photoSave" download="snap.jpg">儲存 · Save</a>
    <button id="photoClose">繼續 · Continue</button>
  </div>
</div>

<script type="module">
/* ============================================================
   Tunables — adjust snap detection here
   All distances are normalized by hand size (wrist → middle
   finger base), so they work at any distance from the camera.
   ============================================================ */
const VIDEO_SRC       = 'video.mp4'; // ← put your video file here (same folder)
const PINCH_ON        = 0.30;  // thumb–middle tip distance below this = "primed" (fingers together)
const RELEASE_OFF     = 0.75;  // distance above this after priming = snap released
const SNAP_WINDOW_MS  = 400;   // release must happen within this time after priming
const SNAP_LOCK_MS    = 6500;  // after the video fires, ignore snaps for this long
const EQUIP_GUARD_MS  = 700;   // brief guard so putting the glove on can't self-trigger
const RESTART_ON_SNAP = true;  // snap while video playing → restart from beginning
const SHOW_LANDMARKS  = false; // draw thumb/middle fingertip dots on the camera view

/* ---- 3D model (Eiffel tower) -------------------------------
   The model is normalized to height 1 with its top at +0.5Y and
   its base at -0.5Y, so the spire sticks to the MIDDLE fingertip
   and the base sticks to the THUMB tip.
   ------------------------------------------------------------ */
const MODEL_DIR       = 'tower/';
const MODEL_OBJ       = '10067_Eiffel_Tower_v1_max2010_it1.obj';
const MODEL_MTL       = '10067_Eiffel_Tower_v1_max2010_it1.mtl';
const MODEL_UP_AXIS   = 'z';   // source model is Z-up (3ds Max export)
const MODEL_BRIGHTEN  = true;  // the .mtl ships Kd 0.59, which dims the texture;
                               // true = show the texture at full brightness
const CAM_DIST        = 5;     // virtual camera distance
const CAM_FOV         = 50;    // virtual camera field of view (deg)

// Slow self-rotation around the tower's own vertical axis.
const MODEL_SPIN_SPEED  = 1;   // radians/sec

// Where the tower's "front" points. The palm normal is derived from a cross
// product of three landmarks, so it magnifies tracking noise and makes the
// model wobble. Off = a steady reference plus the slow spin above.
const USE_PALM_ROTATION = false;

// One Euro filter — kills jitter while your hand is still without adding the
// lag that plain smoothing would. Applied to the landmarks themselves, so
// position, scale and tilt all come out steady.
// Tuned by sweep for normalized (0..1) landmark coords: -78% jitter at rest
// with 0.8 frames of lag. Note beta must be much larger here than the values
// quoted for pixel-space input, since these coords move ~1 unit/sec, not ~500.
const FILTER_MIN_CUTOFF = 0.5;  // lower  = steadier when your hand holds still
const FILTER_BETA       = 5;    // higher = less lag when your hand moves fast

// Cap the render buffer on high-DPI phones so the GPU keeps up.
const MAX_PIXEL_RATIO   = 2;

/* ---- staged interaction -------------------------------------
   Show the back of your hand → countdown → the gauntlet is put
   on → only then can you snap to play, or open and close your
   hand to resize the crystal.
   ------------------------------------------------------------ */
const REQUIRE_EQUIP    = true;  // false = everything is live immediately
const BACK_FACING_MIN  = 0.55;  // how square-on the back of the hand must be,
                                // 0 = any angle, 1 = perfectly flat to camera
const EQUIP_COUNT_MS   = 3000;  // countdown length
const EQUIP_FADE_MS    = 700;   // how long the gauntlet takes to materialize
const UNEQUIP_AFTER_MS = 6000;  // hand out of frame this long → back to the start

// The video detonates out of wherever your fingers were when you snapped.
// Short and front-loaded — a long ease reads as a bounce, not a blast.
const VIDEO_POP_MS    = 320;    // how long the blast takes
const VIDEO_SHOCK_MS  = 560;    // the shockwave ring outlives it slightly
const VIDEO_CLOSE_MS  = 1;    // and it shrinks back when the video finishes
const VIDEO_POP_FROM  = 0.04;   // scale it collapses back to on close

/* ---- sound ---------------------------------------------------
   Fades run on the Web Audio graph rather than by nudging
   `audio.volume` from JS, because the render loop is busy with
   hand tracking and would make a main-thread ramp stutter.
   -------------------------------------------------------------- */
const SNAP_SFX_SRC       = 'finger_snap.mp3';   // 0.32s
const SNAP_SFX_VOLUME    = 3;
const VIDEO_SFX_SRC      = 'Short_Version.mp3'; // 26.6s source, sliced below
const VIDEO_SFX_START    = 0;    // seconds into the track to start from
const VIDEO_SFX_SECONDS  = 5;    // how much of it to play
const VIDEO_SFX_VOLUME   = 0.75;
const VIDEO_SFX_FADE_IN  = 0.35; // seconds
const VIDEO_SFX_FADE_OUT = 0.9;  // seconds

/* ---- the snap photo ------------------------------------------
   The camera frame plus the 3D layer are composited at the moment
   of the snap, then shown once the video finishes.
   -------------------------------------------------------------- */
const PHOTO_ON       = true;
const PHOTO_QUALITY  = 0.92;  // JPEG quality
const PHOTO_SCALE    = 1;     // 1 = screen resolution, 2 = sharper but heavier
const PHOTO_SHOW_MS  = 9000;  // auto-dismiss; 0 = wait for a tap
const PHOTO_KEEP     = 12;    // how many to keep in this session's gallery

/* ---- magic particles ---------------------------------------
   A swirling column of glowing motes around the model, so it
   reads as the hand channelling something into it. Lives in the
   model's local space, so it follows position/scale for free.
   ------------------------------------------------------------ */
const PARTICLES_ON      = true;

// Two populations, the way the reference images read: a dense haze of very
// fine dust, plus a handful of much brighter glints with star flares.
const PARTICLE_DUST_COUNT  = 2200;
const PARTICLE_SPARK_COUNT = 90;
const PARTICLE_DUST_SIZE   = 0.034;  // relative to the model's height
const PARTICLE_SPARK_SIZE  = 0.15;

// White / ice blue / violet, with a rare warm glint for contrast.
const PARTICLE_PALETTE   = [0xffffff, 0x7fc4ff, 0xa070ff, 0xffc98a];
const PARTICLE_PALETTE_W = [0.22,     0.34,     0.34,     0.10];

// A shell rather than a filled cloud, so the silhouette edge reads brightest.
const PARTICLE_SHELL_R     = 0.60;   // shell radius, model heights
const PARTICLE_SHELL_THICK = 0.26;   // how far inside the shell they scatter
const PARTICLE_SHELL_TALL  = 1.30;   // stretch it vertically to suit a tall model

const PARTICLE_SWIRL    = 0.55;      // rad/sec around the model's axis
const PARTICLE_DRIFT    = 0.35;      // rad/sec of slow latitude wander
const PARTICLE_TWINKLE  = 2.4;       // brightness flicker speed
const PARTICLE_BURST    = 2.6;       // motion multiplier right after a snap
const PARTICLE_BURST_R  = 0.55;      // how far the shell blows outward on a snap
const PARTICLE_BURST_MS = 1800;       // how long that burst lasts

/* ---- glove (worn on the hand) ------------------------------
   Drop an OBJ + MTL (+ textures) into the folder below and it
   gets mounted on the hand automatically. Missing files are not
   an error — the app just runs without the glove.
   ------------------------------------------------------------ */
const GLOVE_ON        = true;
const GLOVE_DIR       = 'glove/';
const GLOVE_OBJ       = 'ace_gauntlet.obj';
const GLOVE_MTL       = 'ace_gauntlet.mtl';
// Which way the source model points, read off its own geometry: the long axis
// runs along Z with the fingertips at -Z, and the gems sit on the -Y face.
const GLOVE_FINGER_AXIS = '-z';  // model axis pointing at the fingertips
const GLOVE_BACK_AXIS   = '-y';  // model axis pointing out of the back of the hand
// Fit is described in the model's own anatomy rather than raw scale. This
// gauntlet's mesh runs from the end of its flared cuff to its fingertips, and
// the wrist sits ~67% of the way along, so the cuff can't be treated as the
// mount point. Read off the model: fingertips at Z -5.20, wrist near Z 0.40,
// cuff end at Z 12.00, total length 17.20.
const GLOVE_WRIST_AT  = 0.674; // where the wrist sits, 0 = cuff end, 1 = fingertips
const GLOVE_HAND_LEN  = 1.90;  // wrist → gauntlet fingertip, in palm lengths
const GLOVE_ALONG     = 0;     // extra slide along the palm axis (+ = toward fingers)
const GLOVE_OUT       = 0;     // lift off the palm plane (+ = toward the back of the hand)
const GLOVE_SIDE      = 0;     // shift toward thumb / pinky
const GLOVE_YAW       = 0;     // spin the glove about its own long axis (radians)
const GLOVE_BRIGHTEN  = false; // this .mtl already has sensible colours
// This mesh is a RIGHT-hand gauntlet (with the fingers along -Z and the back of
// the hand along -Y, its thumb falls on the left — the right-hand arrangement).
// The preview is mirrored, though, so a real right hand shows left-hand
// chirality on screen and needs the mirrored mesh; a real left hand needs the
// mesh as authored. Handedness cannot be recovered from the landmarks alone —
// mirroring the hand flips the thumb position and the cross-product axes
// together, leaving every dot product's sign unchanged — so it comes from
// MediaPipe's label.
const GLOVE_AUTO_FLIP  = true;
// Used when no handedness label is available.
const GLOVE_ASSUME_RIGHT_HAND = true;

/* ---- articulation -----------------------------------------
   The mesh is split into forearm / wrist / palm / per-finger
   pieces so each one follows its own landmarks instead of the
   whole gauntlet moving as a single block.
   ------------------------------------------------------------ */
const GLOVE_ARTICULATE = true;
const FINGER_STRETCH   = true; // also stretch each finger to the real one's length
const FINGER_MIN_SCALE = 0.25; // clamps, so a mis-detected landmark can't
const FINGER_MAX_SCALE = 1.80; // blow a finger up or collapse it
// 0 = each finger stays rooted at the model's own knuckle, 1 = it roots on the
// real knuckle landmark, which is what makes the fingertips actually line up.
const FINGER_ROOT_FOLLOW = 1;

/* ---- the wrist -------------------------------------------------
   Waving your hand and twisting it need opposite responses, so the
   palm's rotation relative to the forearm is split into a swing
   (where the hand points — your arm follows that) and a twist
   (rotation about the forearm's own axis — that is the wrist, and
   the cuff should barely follow it).
   ---------------------------------------------------------------- */
const WRIST_SWING_FOLLOW = 1.00; // arm swings with the hand straight away
const WRIST_TWIST_FOLLOW = 0;    // but the cuff does not twist at all — that
                                 // is the whole point of having a wrist. Raise
                                 // it slightly if you want the cuff to creep
                                 // around after a long hold.
const WRIST_MAX_DEG      = 70;   // past this the forearm gets dragged along
// MediaPipe labels handedness as though the image were a mirrored selfie, while
// we feed it the raw frame. If the gauntlet fits the wrong hand, flip this.
const GLOVE_SWAP_HANDS = true;
/* ============================================================ */

import { HandLandmarker, FilesetResolver } from
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

const startScreen = document.getElementById('startScreen');
const startBtn    = document.getElementById('startBtn');
const statusEl    = document.getElementById('status');
const camWrap     = document.getElementById('camWrap');
const shock       = document.getElementById('shock');
const cam         = document.getElementById('cam');
const overlay     = document.getElementById('overlay');
const ctx         = overlay.getContext('2d');
const threeCv     = document.getElementById('three');
const hint        = document.getElementById('hint');
const snapFlash   = document.getElementById('snapFlash');
const player      = document.getElementById('player');

player.src = VIDEO_SRC;

let landmarker = null;
let running = false;
let lastVideoTime = -1;

// snap state machine
let primed = false;
let primedAt = 0;
let snapLockUntil = 0;   // snaps are ignored until this moment
let lastFrameAt = 0;     // for the filter's time step
let lastRenderAt = 0;    // for particle animation

/* ---------------- three.js scene ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas: threeCv, alpha: true, antialias: true });
const scene    = new THREE.Scene();
const camera3d = new THREE.PerspectiveCamera(CAM_FOV, 1, 0.1, 100);
camera3d.position.set(0, 0, CAM_DIST);

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(1, 1.5, 2);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
fillLight.position.set(-1, -0.5, -1);
scene.add(fillLight);

const model = new THREE.Group();
model.visible = false;
model.renderOrder = 1;
scene.add(model);

// inner wrapper that carries the slow self-rotation
let spinner = null;

// the glove is mounted from the whole hand pose, not the two fingertips
const glove = new THREE.Group();
glove.visible = false;
glove.renderOrder = 0;
scene.add(glove);
let gloveLoaded = false;
const gloveMats = [];   // { m, base } so the gauntlet can fade in

/* ---------------- staged interaction ----------------
   WAIT → the user shows the back of their hand
   COUNT → 3, 2, 1 while they hold it there
   EQUIPPED → gauntlet on; snapping and resizing become live */
const PHASE = { WAIT: 'wait', COUNT: 'count', EQUIPPED: 'equipped' };
let phase = REQUIRE_EQUIP ? PHASE.WAIT : PHASE.EQUIPPED;
let phaseAt = 0;
let lastHandAt = 0;
let equipAt = -1e9;
let particleBurstAt = -1e9;   // set by a snap or by putting the gauntlet on
let shownCount = -1;

const countdownEl = document.getElementById('countdown');
const countNumEl  = document.getElementById('countNum');
const equipFlashEl = document.getElementById('equipFlash');

const HINTS = {
  [PHASE.WAIT]:     '手背朝向鏡頭  ·  Show the back of your hand',
  [PHASE.COUNT]:    '保持不動  ·  Hold it there',
  [PHASE.EQUIPPED]: '彈指播放  ·  開合縮放  ·  Snap to play · open hand to resize'
};

function setPhase(next, now) {
  if (phase === next) return;
  phase = next;
  phaseAt = now;
  hint.textContent = HINTS[next];
  countdownEl.classList.toggle('show', next === PHASE.COUNT);
  shownCount = -1;

  if (next === PHASE.EQUIPPED) {
    equipAt = now;
    particleBurstAt = now;
    snapLockUntil = now + EQUIP_GUARD_MS;   // don't self-trigger on the equip gesture
    equipFlashEl.classList.remove('go');
    void equipFlashEl.offsetWidth;   // restart the animation
    equipFlashEl.classList.add('go');
  } else {
    setGloveOpacity(0);
  }
}

// The palm normal already carries the handedness correction, so after it this
// points straight out of the back of the hand.
function backOfHandDir(pts) {
  const wrist = toWorld(pts[0]);
  const idx   = toWorld(pts[5]);
  const pky   = toWorld(pts[17]);
  const n = new THREE.Vector3().crossVectors(
    idx.clone().sub(wrist), pky.clone().sub(wrist)
  );
  if (n.lengthSq() < 1e-12) return null;
  n.normalize();
  if (handIsRight) n.negate();
  return n;
}

function updatePhase(pts, now, haveHand) {
  if (!REQUIRE_EQUIP) return;

  if (!haveHand) {
    if (phase === PHASE.COUNT) setPhase(PHASE.WAIT, now);
    else if (phase === PHASE.EQUIPPED && now - lastHandAt > UNEQUIP_AFTER_MS) {
      setPhase(PHASE.WAIT, now);
    }
    return;
  }
  lastHandAt = now;
  if (phase === PHASE.EQUIPPED) return;

  const n = backOfHandDir(pts);
  const facing = !!n && n.z > BACK_FACING_MIN;   // +z points at the camera

  if (phase === PHASE.WAIT) {
    if (facing) setPhase(PHASE.COUNT, now);
  } else if (phase === PHASE.COUNT) {
    if (!facing) { setPhase(PHASE.WAIT, now); return; }
    const left = EQUIP_COUNT_MS - (now - phaseAt);
    if (left <= 0) { setPhase(PHASE.EQUIPPED, now); return; }
    const n3 = Math.ceil(left / 1000);
    if (n3 !== shownCount) {
      shownCount = n3;
      countNumEl.textContent = n3;
      countNumEl.classList.remove('tick');
      void countNumEl.offsetWidth;
      countNumEl.classList.add('tick');
    }
  }
}

const equipped = () => phase === PHASE.EQUIPPED;

function setGloveOpacity(k) {
  gloveMats.forEach(g => {
    g.m.transparent = true;
    g.m.opacity = g.base * k;
    g.m.depthWrite = k > 0.98;
  });
}
let gloveFlip = 1;   // -1 mirrors the mesh
let handIsRight = GLOVE_ASSUME_RIGHT_HAND;

/* ---------------- layout / coordinate mapping ----------------
   The video is displayed with `object-fit: cover`, which scales it uniformly
   (no stretching) and crops the overflow. These numbers reproduce that exact
   transform so landmarks land on the same screen pixel the camera image is
   actually showing — that is what keeps the model from drifting.
*/
let screenW = 1, screenH = 1;                 // CSS px
let coverW  = 1, coverH  = 1;                 // displayed video size, CSS px
let coverX  = 0, coverY  = 0;                 // top-left of the displayed video
let viewW   = 1, viewH   = 1;                 // world units visible at z=0

function layout() {
  screenW = camWrap.clientWidth  || window.innerWidth;
  screenH = camWrap.clientHeight || window.innerHeight;
  if (screenW < 1 || screenH < 1) return;

  const dpr = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO);

  // 2D overlay: one backing pixel per device pixel, drawn in CSS px
  overlay.width  = Math.round(screenW * dpr);
  overlay.height = Math.round(screenH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 3D layer: same viewport, same aspect — nothing for CSS to rescale
  renderer.setPixelRatio(dpr);
  renderer.setSize(screenW, screenH, false);
  camera3d.aspect = screenW / screenH;
  camera3d.updateProjectionMatrix();
  viewH = 2 * CAM_DIST * Math.tan(THREE.MathUtils.degToRad(CAM_FOV) / 2);
  viewW = viewH * camera3d.aspect;

  // replicate CSS `object-fit: cover` + `object-position: center`
  const vw = cam.videoWidth, vh = cam.videoHeight;
  if (vw && vh) {
    const s = Math.max(screenW / vw, screenH / vh);
    coverW = vw * s;
    coverH = vh * s;
    coverX = (screenW - coverW) / 2;
    coverY = (screenH - coverH) / 2;
  }
}

// normalized landmark → CSS px on screen, including the crop and the mirror
function toScreen(lm) {
  const x = coverX + lm.x * coverW;
  const y = coverY + lm.y * coverH;
  return {
    x: screenW - x,               // video is mirrored, so mirror the point too
    y,
    z: (lm.z || 0) * coverW       // z shares x's scale in MediaPipe's output
  };
}

// normalized landmark → world position for the 3D scene
function toWorld(lm) {
  const p = toScreen(lm);
  return new THREE.Vector3(
     (p.x / screenW - 0.5) * viewW,
    -(p.y / screenH - 0.5) * viewH,
    -(p.z / screenW) * viewW      // MediaPipe z is negative toward the camera
  );
}

window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 300));

/* ---------------- One Euro filter ----------------
   Adaptive low-pass: at low speed the cutoff drops and jitter is smoothed
   away; as speed rises the cutoff rises too, so fast motion stays responsive. */
function makeScalarFilter() {
  let xPrev = null, xHat = null, dxHat = 0;
  const alpha = (cutoff, dt) => {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);
  };
  return (x, dt) => {
    if (xHat === null) { xHat = x; xPrev = x; return x; }
    const dx = (x - xPrev) / dt;
    const aD = alpha(1.0, dt);
    dxHat = aD * dx + (1 - aD) * dxHat;
    const a = alpha(FILTER_MIN_CUTOFF + FILTER_BETA * Math.abs(dxHat), dt);
    xHat = a * x + (1 - a) * xHat;
    xPrev = x;
    return xHat;
  };
}

function makePointFilter() {
  const fx = makeScalarFilter(), fy = makeScalarFilter(), fz = makeScalarFilter();
  return (lm, dt) => ({ x: fx(lm.x, dt), y: fy(lm.y, dt), z: fz(lm.z || 0, dt) });
}

// one filter per landmark we actually use (9 is the middle knuckle, for the glove)
// wrist, palm plane, and the base + tip of every finger the rig drives
const FILTERED_IDS = [0, 2, 4, 5, 8, 9, 12, 13, 16, 17, 20];
let pointFilters = null;
function resetFilters() {
  pointFilters = {};
  FILTERED_IDS.forEach(i => { pointFilters[i] = makePointFilter(); });
}
resetFilters();

/* ---------------- shared model helpers ---------------- */
function prepMaterials(obj, brighten) {
  obj.traverse(child => {
    if (!child.isMesh) return;
    // Some OBJs ship without vertex normals (this gauntlet does). Without them
    // the lighting has nothing to work with and the mesh renders black.
    if (child.geometry && !child.geometry.attributes.normal) {
      child.geometry.computeVertexNormals();
    }
    const mats = Array.isArray(child.material) ? child.material : [child.material];
    mats.forEach(m => {
      if (!m) return;
      m.side = THREE.DoubleSide;
      if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
      // Only worth doing when there is a texture underneath: Kd is what dims
      // it. With no map, Kd *is* the model's colour, and whitening it throws
      // that colour away.
      if (brighten && m.color && m.map) m.color.setHex(0xffffff);
    });
  });
}

// load an OBJ, using its MTL when one is present
async function loadObjWithMtl(dir, objFile, mtlFile, onProgress) {
  let materials = null;
  try {
    materials = await new MTLLoader().setPath(dir).loadAsync(mtlFile);
    materials.preload();
  } catch (e) {
    materials = null;   // no .mtl is fine — OBJLoader falls back to a default
  }
  const loader = new OBJLoader().setPath(dir);
  if (materials) loader.setMaterials(materials);
  return loader.loadAsync(objFile, onProgress);
}

/* ---------------- the model the hand holds ---------------- */
// Rotate a Z-up (or X-up) source model so its height runs along +Y, then
// scale it to height 1 and centre it so it spans -0.5Y .. +0.5Y.
function normalizeModel(obj) {
  if (MODEL_UP_AXIS === 'z') obj.rotation.x = -Math.PI / 2;
  else if (MODEL_UP_AXIS === 'x') obj.rotation.z = Math.PI / 2;
  obj.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  if (size.y < 1e-9) return obj;

  const s = 1 / size.y;
  obj.scale.setScalar(s);
  obj.position.set(-center.x * s, -center.y * s, -center.z * s);

  // wrapper that spins the tower around its own vertical axis
  spinner = new THREE.Group();
  spinner.add(obj);
  return spinner;
}

async function loadModel(onProgress) {
  const obj = await loadObjWithMtl(MODEL_DIR, MODEL_OBJ, MODEL_MTL, onProgress);
  prepMaterials(obj, MODEL_BRIGHTEN);   // thin lattice reads better lit both sides
  model.add(normalizeModel(obj));
}

/* ---------------- the glove worn on the hand ----------------
   Normalized so the wrist end sits at the origin and the fingers point along
   +Y with a total height of 1. Mounting then just scales by palm length. */
const AXIS_VECTORS = {
   'x': [ 1, 0, 0], '-x': [-1, 0, 0],
   'y': [ 0, 1, 0], '-y': [ 0,-1, 0],
   'z': [ 0, 0, 1], '-z': [ 0, 0,-1]
};
function axisVector(key) {
  const a = AXIS_VECTORS[key] || AXIS_VECTORS['y'];
  return new THREE.Vector3(a[0], a[1], a[2]);
}

// Which mesh follows which finger. finger_3 is the one nearest the thumb in the
// source mesh (thumb at +X, finger_3 at X 0.86..1.98), so it is the index.
const FINGER_RIG = [
  { mesh: 'finger_3', cap: 'knuckle_cap_3', mcp: 5,  tip: 8  },  // index
  { mesh: 'finger_2', cap: 'knuckle_cap_2', mcp: 9,  tip: 12 },  // middle
  { mesh: 'finger_1', cap: 'knuckle_cap_1', mcp: 13, tip: 16 },  // ring
  { mesh: 'finger_0', cap: 'knuckle_cap_0', mcp: 17, tip: 20 },  // pinky
  { mesh: 'thumb',    cap: null,            mcp: 2,  tip: 4  }   // thumb
];
// Everything not listed here stays on the forearm: the cuff, bands, filigree
// and gems, which should not swing with the hand.
const PALM_MESHES = ['hand_palm'];

let wristPivot = null;
const fingerRigs = [];
const forearmQuat = new THREE.Quaternion();
let forearmInit = false;

// Split a rotation into the part about `axis` (twist) and the rest (swing).
function swingTwist(q, axis) {
  const p = new THREE.Vector3(q.x, q.y, q.z);
  const proj = axis.clone().multiplyScalar(p.dot(axis));
  const twist = new THREE.Quaternion(proj.x, proj.y, proj.z, q.w);
  if (twist.lengthSq() < 1e-12) twist.set(0, 0, 0, 1);   // 180° edge case
  twist.normalize();
  const swing = q.clone().multiply(twist.clone().invert());
  return { swing, twist };
}

function normalizeGlove(obj) {
  // Rotate the model so its fingertips point along +Y and the back of the hand
  // faces +Z, which is the frame updateGlove() mounts into.
  const finger = axisVector(GLOVE_FINGER_AXIS).normalize();
  const back   = axisVector(GLOVE_BACK_AXIS);
  back.addScaledVector(finger, -back.dot(finger));
  if (back.lengthSq() < 1e-8) back.set(0, 0, 1).addScaledVector(finger, -finger.z);
  back.normalize();
  const side = new THREE.Vector3().crossVectors(finger, back);   // right-handed
  obj.quaternion.setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(side, finger, back).invert()
  );
  obj.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  if (size.y < 1e-9) return obj;

  // height 1, wrist end sitting at y = 0 so mounting is just a scale
  const s = 1 / size.y;
  obj.scale.setScalar(s);
  obj.position.set(-center.x * s, -box.min.y * s, -center.z * s);

  const yaw = new THREE.Group();
  yaw.add(obj);
  yaw.rotation.y = GLOVE_YAW;
  return yaw;
}

// Average the vertices at each end of a mesh along Y, giving the two points a
// finger actually runs between. More faithful than a bounding box for parts
// that sit at an angle, like the thumb.
function meshEnds(mesh) {
  const pos = mesh.geometry.attributes.position;
  const v = new THREE.Vector3();
  const ys = [];
  for (let i = 0; i < pos.count; i++) {
    ys.push(v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld).y);
  }
  ys.sort((a, b) => a - b);
  const loCut = ys[Math.floor(ys.length * 0.2)];
  const hiCut = ys[Math.floor(ys.length * 0.8)];

  const base = new THREE.Vector3(), tip = new THREE.Vector3();
  let nb = 0, nt = 0;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
    if (v.y <= loCut)      { base.add(v); nb++; }
    else if (v.y >= hiCut) { tip.add(v);  nt++; }
  }
  if (nb) base.divideScalar(nb);
  if (nt) tip.divideScalar(nt);
  return { base, tip };
}

// Re-parent the meshes into a forearm → wrist → finger hierarchy. attach()
// keeps every piece exactly where it already sits, so this only changes what
// each piece is allowed to move with.
function buildGloveRig(root) {
  root.updateMatrixWorld(true);
  const byName = {};
  root.traverse(c => { if (c.isMesh && c.name) byName[c.name] = c; });

  // The wrist joint. Anything under it follows the palm; the cuff left behind
  // in `root` keeps the forearm's own, much steadier orientation.
  wristPivot = new THREE.Group();
  wristPivot.position.set(0, GLOVE_WRIST_AT, 0);
  root.add(wristPivot);
  root.updateMatrixWorld(true);

  PALM_MESHES.forEach(n => { if (byName[n]) wristPivot.attach(byName[n]); });

  FINGER_RIG.forEach(spec => {
    const mesh = byName[spec.mesh];
    if (!mesh) return;

    // Pivot at the knuckle — the base of the finger — pointing up its length.
    // Taken from the ends of the mesh itself rather than its bounding box,
    // since an angled part like the thumb is badly described by a box.
    const ends = meshEnds(mesh);
    wristPivot.updateMatrixWorld(true);
    const kLocal = wristPivot.worldToLocal(ends.base);
    const tLocal = wristPivot.worldToLocal(ends.tip);
    const dir = tLocal.clone().sub(kLocal);
    const len = dir.length();
    if (len < 1e-9) return;
    dir.divideScalar(len);

    const pivot = new THREE.Group();
    pivot.position.copy(kLocal);
    // Rest rotation aligns the pivot's own +Y with the finger, so scaling Y
    // later stretches it along its length rather than sideways.
    pivot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    wristPivot.add(pivot);
    wristPivot.updateMatrixWorld(true);
    pivot.updateMatrixWorld(true);

    pivot.attach(mesh);
    if (spec.cap && byName[spec.cap]) pivot.attach(byName[spec.cap]);

    fingerRigs.push({
      pivot,
      rest: pivot.quaternion.clone(),
      restPos: kLocal.clone(),
      restDir: dir.clone(),
      restLen: len,
      mcp: spec.mcp,
      tip: spec.tip
    });
  });
}

async function loadGlove() {
  const obj = await loadObjWithMtl(GLOVE_DIR, GLOVE_OBJ, GLOVE_MTL);
  prepMaterials(obj, GLOVE_BRIGHTEN);

  // remember each material's own opacity so it can be faded in on equip
  obj.traverse(c => {
    if (!c.isMesh) return;
    const mm = Array.isArray(c.material) ? c.material : [c.material];
    mm.forEach(m => {
      if (m && !gloveMats.some(g => g.m === m)) gloveMats.push({ m, base: m.opacity });
    });
  });

  const root = normalizeGlove(obj);
  if (GLOVE_ARTICULATE) buildGloveRig(root);
  glove.add(root);
  gloveLoaded = true;
  setGloveOpacity(REQUIRE_EQUIP ? 0 : 1);
}

// Point each gauntlet finger down its real counterpart, and stretch it to the
// same length so a curled finger foreshortens instead of poking through.
function updateFingers(pts) {
  if (!wristPivot) return;
  glove.updateMatrixWorld(true);

  fingerRigs.forEach(r => {
    const a = wristPivot.worldToLocal(toWorld(pts[r.mcp]));
    const b = wristPivot.worldToLocal(toWorld(pts[r.tip]));
    const d = b.clone().sub(a);
    const len = d.length();
    if (len < 1e-9) return;
    d.divideScalar(len);

    // Root the finger on the real knuckle, otherwise it points the right way
    // but starts in the wrong place and the tip lands short.
    r.pivot.position.lerpVectors(r.restPos, a, FINGER_ROOT_FOLLOW);

    r.pivot.quaternion
      .setFromUnitVectors(r.restDir, d)
      .multiply(r.rest);

    if (FINGER_STRETCH) {
      const k = THREE.MathUtils.clamp(
        len / r.restLen, FINGER_MIN_SCALE, FINGER_MAX_SCALE
      );
      r.pivot.scale.set(1, k, 1);
    }
  });
}

// Mount the glove on the whole hand: wrist → middle knuckle gives the long
// axis and the size, the palm plane gives which way the back of the hand faces.
function updateGlove(pts) {
  if (!gloveLoaded) return;
  if (!equipped()) { glove.visible = false; return; }

  // materialize over the first moments after it goes on
  const fade = THREE.MathUtils.clamp((performance.now() - equipAt) / EQUIP_FADE_MS, 0, 1);
  setGloveOpacity(fade);

  const wrist  = toWorld(pts[0]);
  const midMcp = toWorld(pts[9]);
  const idxMcp = toWorld(pts[5]);
  const pkyMcp = toWorld(pts[17]);

  const up = midMcp.clone().sub(wrist);
  const palmLen = up.length();
  if (palmLen < 1e-6) { glove.visible = false; return; }
  up.divideScalar(palmLen);

  const normal = new THREE.Vector3().crossVectors(
    idxMcp.clone().sub(wrist),
    pkyMcp.clone().sub(wrist)
  );
  if (normal.lengthSq() < 1e-12) normal.set(0, 0, 1);
  normal.normalize();
  normal.addScaledVector(up, -normal.dot(up));
  if (normal.lengthSq() < 1e-8) {
    normal.set(0, 0, 1).addScaledVector(up, -up.z);
    if (normal.lengthSq() < 1e-8) normal.set(1, 0, 0).addScaledVector(up, -up.x);
  }
  normal.normalize();

  // Each hand needs exactly one of these, never both — verified by testing all
  // four combinations against three independent checks (thumb side, which way
  // the ornamented back faces, and index-vs-pinky order):
  //   right hand → negate the normal, turning the mesh about the palm axis
  //   left hand  → mirror the mesh across its own width
  gloveFlip = 1;
  if (GLOVE_AUTO_FLIP) {
    if (handIsRight) normal.negate();
    else             gloveFlip = -1;
  }

  const right = new THREE.Vector3().crossVectors(up, normal).normalize();
  const palmQuat = new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(right, up, normal)
  );

  // --- the wrist joint ------------------------------------------------------
  // Split the palm's rotation relative to the forearm into swing and twist.
  // The arm follows the swing (move your hand and your forearm goes with it)
  // but hardly any of the twist — that is what the wrist is for. Past the
  // joint's limit the forearm is dragged along, the way a real arm would turn.
  if (!forearmInit) { forearmQuat.copy(palmQuat); forearmInit = true; }
  else {
    const relRaw = forearmQuat.clone().invert().multiply(palmQuat);
    const { swing, twist } = swingTwist(relRaw, new THREE.Vector3(0, 1, 0));
    const id = new THREE.Quaternion();
    forearmQuat
      .multiply(id.clone().slerp(swing, WRIST_SWING_FOLLOW))
      .multiply(id.clone().slerp(twist, WRIST_TWIST_FOLLOW))
      .normalize();
  }

  let rel = forearmQuat.clone().invert().multiply(palmQuat);
  const maxRad = THREE.MathUtils.degToRad(WRIST_MAX_DEG);
  const bend = 2 * Math.acos(Math.min(1, Math.abs(rel.w)));
  if (bend > maxRad) {
    forearmQuat.slerp(palmQuat, 1 - maxRad / bend);
    rel = forearmQuat.clone().invert().multiply(palmQuat);
  }

  glove.quaternion.copy(forearmQuat);
  if (wristPivot) wristPivot.quaternion.copy(rel);

  // Total mesh length that makes the gauntlet's fingertips reach the hand's.
  const total = GLOVE_HAND_LEN / Math.max(1 - GLOVE_WRIST_AT, 1e-3);
  const scale = palmLen * total;

  // The model is sculpted for one hand — mirror it across its own width for
  // the other one. DoubleSide materials keep it rendering after the flip.
  glove.scale.set(scale * gloveFlip, scale, scale);

  // Slide the mesh down so its wrist point, not its cuff end, sits on the
  // wrist. The offsets ride the forearm's frame, which is what carries the mesh.
  const upF     = new THREE.Vector3(0, 1, 0).applyQuaternion(forearmQuat);
  const normalF = new THREE.Vector3(0, 0, 1).applyQuaternion(forearmQuat);
  const rightF  = new THREE.Vector3(1, 0, 0).applyQuaternion(forearmQuat);
  glove.position.copy(wrist)
    .addScaledVector(upF,     GLOVE_ALONG * palmLen - GLOVE_WRIST_AT * scale)
    .addScaledVector(normalF, GLOVE_OUT   * palmLen)
    .addScaledVector(rightF,  GLOVE_SIDE  * palmLen);
  glove.visible = true;

  if (GLOVE_ARTICULATE) updateFingers(pts);
}

/* ---------------- magic particles ----------------
   Built from the reference images: a dense shell of very fine dust with the
   silhouette edge reading brightest, plus a few bright star glints, and a
   radial blow-out on a snap. */
const layers = [];   // { points, pos, col, state, baseSize, spark }

function makeDotTexture() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grad.addColorStop(0.00, 'rgba(255,255,255,1)');
  grad.addColorStop(0.25, 'rgba(255,255,255,0.6)');
  grad.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// A glint with a cross flare, like the bright points in the third reference.
function makeStarTexture() {
  const s = 128, h = s / 2;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');

  const halo = g.createRadialGradient(h, h, 0, h, h, h);
  halo.addColorStop(0.00, 'rgba(255,255,255,1)');
  halo.addColorStop(0.12, 'rgba(255,255,255,0.55)');
  halo.addColorStop(0.40, 'rgba(255,255,255,0.10)');
  halo.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = halo;
  g.fillRect(0, 0, s, s);

  // four tapered spikes
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = 'rgba(255,255,255,0.85)';
  [0, Math.PI / 2].forEach(rot => {
    g.save();
    g.translate(h, h);
    g.rotate(rot);
    g.beginPath();
    g.moveTo(-h, 0); g.lineTo(0, -2.2); g.lineTo(h, 0); g.lineTo(0, 2.2);
    g.closePath();
    g.fill();
    g.restore();
  });

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function pickPaletteColor(out) {
  let r = Math.random(), i = 0;
  while (i < PARTICLE_PALETTE_W.length - 1 && r > PARTICLE_PALETTE_W[i]) {
    r -= PARTICLE_PALETTE_W[i];
    i++;
  }
  return out.setHex(PARTICLE_PALETTE[i]);
}

function buildLayer(count, baseSize, texture, spark) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const state = [];
  const tmp = new THREE.Color();

  for (let i = 0; i < count; i++) {
    // A point on a shell: uniform on the sphere, then pulled inward by a
    // squared random so most of them sit close to the surface.
    const u = Math.random() * 2 - 1;                 // cos(latitude)
    const depth = Math.random() * Math.random();     // biased toward 0 = the rim
    pickPaletteColor(tmp);
    state.push({
      theta: Math.random() * Math.PI * 2,
      phi:   Math.acos(u),
      r:     PARTICLE_SHELL_R * (1 - PARTICLE_SHELL_THICK * depth),
      w:     PARTICLE_SWIRL * (0.55 + Math.random()) * (Math.random() < 0.25 ? -1 : 1),
      dw:    PARTICLE_DRIFT * (Math.random() - 0.5),
      tw:    Math.random() * Math.PI * 2,
      twW:   PARTICLE_TWINKLE * (0.5 + Math.random()),
      base:  spark ? 0.85 + Math.random() * 0.15 : 0.55 + Math.random() * 0.45,
      cr: tmp.r, cg: tmp.g, cb: tmp.b
    });
    col[i*3] = tmp.r; col[i*3+1] = tmp.g; col[i*3+2] = tmp.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const points = new THREE.Points(geo, new THREE.PointsMaterial({
    size: baseSize,
    map: texture,
    vertexColors: true,
    transparent: true,
    opacity: 1.0,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  }));
  points.frustumCulled = false;      // positions are rewritten every frame
  points.renderOrder = 2;
  model.add(points);                 // rides along with the model for free

  layers.push({
    points, state, baseSize, spark,
    pos: geo.attributes.position,
    col: geo.attributes.color
  });
}

function buildParticles() {
  buildLayer(PARTICLE_DUST_COUNT,  PARTICLE_DUST_SIZE,  makeDotTexture(),  false);
  buildLayer(PARTICLE_SPARK_COUNT, PARTICLE_SPARK_SIZE, makeStarTexture(), true);
}

function updateParticles(dt, modelScale, now) {
  if (!layers.length) return;

  // brief flourish right after a snap: everything speeds up, the shell blows
  // outward, and the whole cloud brightens
  const since = now - particleBurstAt;
  const t = since < PARTICLE_BURST_MS ? 1 - since / PARTICLE_BURST_MS : 0;
  const boost  = 1 + (PARTICLE_BURST - 1) * t;
  const swell  = 1 + PARTICLE_BURST_R * t;

  layers.forEach(L => {
    const p = L.pos.array, c = L.col.array;
    for (let i = 0; i < L.state.length; i++) {
      const s = L.state[i];
      s.theta += s.w  * boost * dt;
      s.phi   += s.dw * boost * dt;
      // bounce off the poles so nothing piles up at the top or bottom
      if (s.phi < 0.05)          { s.phi = 0.05;          s.dw = -s.dw; }
      else if (s.phi > Math.PI - 0.05) { s.phi = Math.PI - 0.05; s.dw = -s.dw; }
      s.tw += s.twW * dt;

      const r  = s.r * swell;
      const sp = Math.sin(s.phi);
      p[i*3]     = r * sp * Math.cos(s.theta);
      p[i*3 + 1] = r * Math.cos(s.phi) * PARTICLE_SHELL_TALL;
      p[i*3 + 2] = r * sp * Math.sin(s.theta);

      // Twinkle, and lift the ones near the silhouette edge — that rim
      // brightening is what makes the reference read as a shell.
      const rim = 0.62 + 0.38 * sp;
      const k = s.base * rim * (0.72 + 0.28 * Math.sin(s.tw)) * (1 + 0.8 * t);
      c[i*3]     = s.cr * k;
      c[i*3 + 1] = s.cg * k;
      c[i*3 + 2] = s.cb * k;
    }
    L.pos.needsUpdate = true;
    L.col.needsUpdate = true;

    // point size is in world units and ignores the parent's scale, so track it
    L.points.material.size = L.baseSize * modelScale * (L.spark ? boost : 1);
  });
}

/* ---------------- start ---------------- */
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  initAudio();   // must happen inside the click, browsers require the gesture
  try {
    statusEl.textContent = 'Loading hand model… 載入手部模型中…';
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    landmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numHands: 1
    });

    statusEl.textContent = 'Loading tower model… 載入鐵塔模型中…';
    await loadModel(e => {
      if (e && e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        statusEl.textContent = `Loading tower model… 載入鐵塔模型中… ${pct}%`;
      }
    });

    if (PARTICLES_ON) buildParticles();

    if (GLOVE_ON) {
      statusEl.textContent = 'Loading glove… 載入手套中…';
      try {
        await loadGlove();
      } catch (e) {
        // no glove asset yet — carry on without it
        console.warn('glove not loaded:', e.message);
      }
    }

    statusEl.textContent = 'Requesting camera… 請求相機權限…';
    // Ask for a stream shaped like the screen, so `cover` crops as little as
    // possible. Any resolution the device returns still maps correctly.
    const portrait = window.innerHeight >= window.innerWidth;
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width:  { ideal: portrait ? 720 : 1280 },
        height: { ideal: portrait ? 1280 : 720 }
      }
    });
    cam.srcObject = stream;
    await new Promise(res => cam.onloadedmetadata = res);
    await cam.play();

    startScreen.style.display = 'none';
    camWrap.style.display = 'block';
    hint.style.display = 'block';
    hint.textContent = gloveLoaded
      ? HINTS[phase]
      : `找不到 ${GLOVE_DIR}${GLOVE_OBJ}，未載入手套 · glove asset missing`;
    layout();

    phaseAt = lastHandAt = performance.now();
    running = true;
    requestAnimationFrame(tick);
  } catch (err) {
    startBtn.disabled = false;
    statusEl.textContent = 'Failed to start 啟動失敗: ' + (err.message || err.name);
  }
});

function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, dz = (a.z || 0) - (b.z || 0);
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function tick() {
  if (!running) return;
  const now = performance.now();

  if (cam.currentTime !== lastVideoTime) {
    lastVideoTime = cam.currentTime;
    const result = landmarker.detectForVideo(cam, now);
    processHands(result);
  }

  // slow self-rotation, independent of the hand so it never looks jittery
  if (spinner) spinner.rotation.y = (now / 1000) * MODEL_SPIN_SPEED;

  // say why snapping is doing nothing, rather than just ignoring the user
  if (equipped()) {
    const left = snapLockUntil - now;
    const txt = left > 0
      ? `冷卻中 ${(left / 1000).toFixed(1)}s  ·  cooling down`
      : HINTS[PHASE.EQUIPPED];
    if (hint.textContent !== txt) hint.textContent = txt;
  }

  const rdt = lastRenderAt ? Math.min((now - lastRenderAt) / 1000, 0.1) : 1 / 60;
  lastRenderAt = now;
  if (model.visible) updateParticles(rdt, model.scale.x, now);

  renderer.render(scene, camera3d);

  // Must happen here, not later: with preserveDrawingBuffer off the WebGL
  // canvas is only readable between rendering and the browser compositing it.
  if (pendingCapture) {
    pendingCapture = false;
    try {
      lastPhoto = capturePhoto();
      photos.push(lastPhoto);
      while (photos.length > PHOTO_KEEP) photos.shift();
    } catch (e) {
      console.warn('photo capture failed:', e.message);
      lastPhoto = null;
    }
  }

  requestAnimationFrame(tick);
}

function processHands(result) {
  ctx.clearRect(0, 0, screenW, screenH);

  const now = performance.now();
  const hand = result.landmarks && result.landmarks[0];

  // which hand is on screen, so the model can be mirrored for the other one
  const hd = result.handedness && result.handedness[0] && result.handedness[0][0];
  if (hd) {
    const labelIsRight = hd.categoryName.toLowerCase() === 'right';
    handIsRight = GLOVE_SWAP_HANDS ? !labelIsRight : labelIsRight;
  }

  if (!hand) {
    primed = false;
    model.visible = false;
    glove.visible = false;
    resetFilters();   // start clean next time the hand appears
    forearmInit = false;
    lastFrameAt = 0;
    updatePhase(null, now, false);
    return;
  }

  const wrist     = hand[0];
  const middleMcp = hand[9];
  const thumbTip  = hand[4];
  const middleTip = hand[12];

  // De-jitter the landmarks the model rides on. Snap detection deliberately
  // keeps using the raw values so its timing stays as responsive as before.
  const dt = lastFrameAt ? Math.max((now - lastFrameAt) / 1000, 1e-3) : 1 / 30;
  lastFrameAt = now;
  const smooth = {};
  FILTERED_IDS.forEach(i => { smooth[i] = pointFilters[i](hand[i], dt); });

  // Show the back of your hand → countdown → gauntlet on. Nothing below this
  // does anything until that has happened.
  updatePhase(smooth, now, true);

  updateModel(smooth);
  updateGlove(smooth);

  // normalize by hand size so detection works near or far
  const handSize = dist(wrist, middleMcp);
  if (handSize < 1e-6) return;
  const pinchDist = dist(thumbTip, middleTip) / handSize;

  if (SHOW_LANDMARKS) {
    drawDot(smooth[4],  primed ? '#6fcf97' : '#4a90d9');
    drawDot(smooth[12], primed ? '#6fcf97' : '#4a90d9');
  }

  // snapping only works once the gauntlet is on, and not while the photo is up
  if (!equipped() || photoView.classList.contains('show')) { primed = false; return; }

  // state machine: pinch (primed) → fast release = snap
  if (!primed) {
    if (pinchDist < PINCH_ON) {
      primed = true;
      primedAt = now;
    }
  } else {
    if (pinchDist > RELEASE_OFF) {
      primed = false;
      if (now - primedAt < SNAP_WINDOW_MS && now >= snapLockUntil) {
        snapLockUntil = now + SNAP_LOCK_MS;
        particleBurstAt = now;
        // midpoint of the two fingers that did the snapping, in screen px
        const a = toScreen(smooth[4]), b = toScreen(smooth[12]);
        onSnap({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
      }
    } else if (now - primedAt > SNAP_WINDOW_MS && pinchDist > PINCH_ON) {
      // held too long without releasing — reset so a slow open doesn't trigger
      primed = false;
    }
  }
}

// Anchor the model: top → middle tip (12), base → thumb tip (4). Scale comes
// from the tip-to-tip distance and the vertical axis from that same pair, so
// the tower still leans with your fingers. Its facing direction is steady
// (see USE_PALM_ROTATION) and the slow spin is applied in tick().
function updateModel(pts) {
  // the crystal only exists once the gauntlet is on
  if (!equipped()) { model.visible = false; return; }

  const pMiddle = toWorld(pts[12]);
  const pThumb  = toWorld(pts[4]);

  const up = pMiddle.clone().sub(pThumb);
  const len = up.length();
  if (len < 1e-6) { model.visible = false; return; }
  up.divideScalar(len);

  const normal = new THREE.Vector3();
  if (USE_PALM_ROTATION) {
    // palm normal → the tower's front follows the palm (noisier)
    const pWrist    = toWorld(pts[0]);
    const pIndexMcp = toWorld(pts[5]);
    const pPinkyMcp = toWorld(pts[17]);
    normal.crossVectors(
      pIndexMcp.clone().sub(pWrist),
      pPinkyMcp.clone().sub(pWrist)
    );
    if (normal.lengthSq() < 1e-12) normal.set(0, 0, 1);
    normal.normalize();
  } else {
    // steady reference: face the camera, then let the spin do the rotating
    normal.set(0, 0, 1);
  }

  // make the facing direction perpendicular to the finger axis
  normal.addScaledVector(up, -normal.dot(up));
  if (normal.lengthSq() < 1e-8) {
    // finger axis points straight at the camera — pick any perpendicular
    normal.set(1, 0, 0).addScaledVector(up, -up.x);
    if (normal.lengthSq() < 1e-8) normal.set(0, 1, 0).addScaledVector(up, -up.y);
  }
  normal.normalize();

  const right = new THREE.Vector3().crossVectors(up, normal).normalize();
  model.quaternion.setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(right, up, normal)
  );
  model.position.copy(pMiddle).add(pThumb).multiplyScalar(0.5);
  model.scale.setScalar(len);
  model.visible = true;
}

function drawDot(lm, color) {
  const p = toScreen(lm);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
  ctx.fill();
}

/* ---------------- sound ---------------- */
let audioCtx = null, snapSfx = null, videoSfx = null, videoSfxStop = null;

function wireSound(src) {
  const el = new Audio(src);
  el.preload = 'auto';
  const gain = audioCtx.createGain();
  gain.gain.value = 0;
  audioCtx.createMediaElementSource(el).connect(gain).connect(audioCtx.destination);
  return { el, gain };
}

// Called from the start button, which is the user gesture browsers require.
function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    snapSfx  = wireSound(SNAP_SFX_SRC);
    videoSfx = wireSound(VIDEO_SFX_SRC);
  } catch (e) {
    console.warn('audio unavailable:', e.message);
  }
}

function playSnapSfx() {
  if (!snapSfx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t = audioCtx.currentTime;
  snapSfx.gain.gain.cancelScheduledValues(t);
  snapSfx.gain.gain.setValueAtTime(SNAP_SFX_VOLUME, t);
  snapSfx.el.currentTime = 0;
  snapSfx.el.play().catch(() => {});
}

// Only a slice of the track, ramped in and out.
function playVideoSfx() {
  if (!videoSfx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const g = videoSfx.gain.gain, t = audioCtx.currentTime;
  const dur = VIDEO_SFX_SECONDS;
  const fi  = Math.min(VIDEO_SFX_FADE_IN, dur / 2);
  const fo  = Math.min(VIDEO_SFX_FADE_OUT, dur - fi);

  g.cancelScheduledValues(t);
  g.setValueAtTime(0, t);
  g.linearRampToValueAtTime(VIDEO_SFX_VOLUME, t + fi);
  g.setValueAtTime(VIDEO_SFX_VOLUME, t + dur - fo);
  g.linearRampToValueAtTime(0, t + dur);

  videoSfx.el.currentTime = VIDEO_SFX_START;
  videoSfx.el.play().catch(() => {});
  clearTimeout(videoSfxStop);
  videoSfxStop = setTimeout(() => videoSfx.el.pause(), dur * 1000 + 80);
}

// Duck out early if the video is dismissed before the slice finishes.
function stopVideoSfx() {
  if (!videoSfx || videoSfx.el.paused) return;
  clearTimeout(videoSfxStop);
  const g = videoSfx.gain.gain, t = audioCtx.currentTime;
  g.cancelScheduledValues(t);
  g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(0, t + 0.2);
  videoSfxStop = setTimeout(() => videoSfx.el.pause(), 240);
}

/* ---------------- the snap photo ---------------- */
const photoView  = document.getElementById('photoView');
const photoImg   = document.getElementById('photoImg');
const photoSave  = document.getElementById('photoSave');
const photoClose = document.getElementById('photoClose');

let pendingCapture = false;   // set on a snap, consumed by the next render
let lastPhoto = null;
let photoTimer = null;
const photos = [];            // this session's gallery

// Composite exactly what is on screen: the camera cropped and mirrored the way
// CSS shows it, with the 3D layer over the top.
function capturePhoto() {
  const dpr = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO) * PHOTO_SCALE;
  const w = Math.max(1, Math.round(screenW * dpr));
  const h = Math.max(1, Math.round(screenH * dpr));

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#000';
  g.fillRect(0, 0, w, h);

  if (cam.videoWidth) {
    // `cover` crop, then mirrored — the same transform the preview uses
    g.save();
    g.translate(w, 0);
    g.scale(-1, 1);
    g.drawImage(cam, coverX * dpr, coverY * dpr, coverW * dpr, coverH * dpr);
    g.restore();
  }
  // the 3D canvas is already in screen space and unmirrored
  g.drawImage(threeCv, 0, 0, w, h);

  return c.toDataURL('image/jpeg', PHOTO_QUALITY);
}

function showPhoto() {
  if (!lastPhoto) return false;
  photoImg.src = lastPhoto;
  photoSave.href = lastPhoto;
  photoSave.download = `snap-${photos.length}.jpg`;
  photoView.classList.add('show');
  clearTimeout(photoTimer);
  if (PHOTO_SHOW_MS > 0) photoTimer = setTimeout(hidePhoto, PHOTO_SHOW_MS);
  return true;
}

function hidePhoto() {
  clearTimeout(photoTimer);
  photoView.classList.remove('show');
  // let the user settle before the next snap counts
  snapLockUntil = Math.max(snapLockUntil, performance.now() + EQUIP_GUARD_MS);
}

photoClose.addEventListener('click', hidePhoto);
photoView.addEventListener('click', e => { if (e.target === photoView) hidePhoto(); });

// Where on screen the snap happened, so the video can grow out of that spot.
let popPoint = null;

function onSnap(at) {
  playSnapSfx();
  // grab the frame on the next render, while the WebGL buffer is still readable
  if (PHOTO_ON) pendingCapture = true;
  snapFlash.classList.add('show');
  setTimeout(() => snapFlash.classList.remove('show'), 500);

  if (player.style.display === 'block') {
    if (RESTART_ON_SNAP) {
      player.currentTime = 0;
      player.play();
    }
    return;
  }

  // Scaling about a transform-origin placed at the fingers makes the blast
  // come out of them.
  popPoint = at || { x: screenW / 2, y: screenH / 2 };

  // shockwave thrown off from the same point
  shock.style.left = `${popPoint.x}px`;
  shock.style.top  = `${popPoint.y}px`;
  shock.style.setProperty('--shock', `${VIDEO_SHOCK_MS}ms`);
  shock.classList.remove('go');
  void shock.offsetWidth;               // restart the animation
  shock.classList.add('go');

  // and the view flinches
  camWrap.classList.remove('shake');
  void camWrap.offsetWidth;
  camWrap.classList.add('shake');
  setTimeout(() => camWrap.classList.remove('shake'), 320);

  player.style.transition = 'none';
  player.style.transform = '';
  player.style.opacity = '';
  player.style.transformOrigin = `${popPoint.x}px ${popPoint.y}px`;
  player.style.setProperty('--pop', `${VIDEO_POP_MS}ms`);
  player.style.display = 'block';
  player.classList.remove('blast');
  void player.offsetWidth;              // commit before the keyframes run
  player.classList.add('blast');

  player.currentTime = 0;
  player.play().catch(err => {
    hint.textContent = 'Video play failed 影片播放失敗: ' + err.message;
    player.style.display = 'none';
  });
  playVideoSfx();
}

player.addEventListener('ended', () => {
  stopVideoSfx();   // no-op if the slice already faded itself out
  // shrink back into the same spot it came from
  const p = popPoint || { x: screenW / 2, y: screenH / 2 };
  player.classList.remove('blast');     // the keyframes' fill would win otherwise
  player.style.transform = 'scale(1)';
  player.style.opacity = '1';
  void player.offsetWidth;
  player.style.transformOrigin = `${p.x}px ${p.y}px`;
  player.style.transition =
    `transform ${VIDEO_CLOSE_MS}ms cubic-bezier(.5,0,.75,0), ` +
    `opacity ${VIDEO_CLOSE_MS}ms ease-in`;
  player.style.transform = `scale(${VIDEO_POP_FROM})`;
  player.style.opacity = '0';
  setTimeout(() => {
    player.style.display = 'none';
    player.style.transition = 'none';
    player.style.transform = 'scale(1)';
    player.style.opacity = '1';
    // and here is the shot taken the instant you snapped
    if (PHOTO_ON) showPhoto();
  }, VIDEO_CLOSE_MS);
});
</script>

</body>
